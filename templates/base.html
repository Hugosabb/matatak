<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="description" content="Free Online Chess Variants">
    <meta property="og:image" content={{ static("favicon/ms-icon-310x310.png") }} />
    <meta property="og:image:width" content="310" />
    <meta property="og:image:height" content="310" />
    <meta name="keywords"
        content="Chess variants xiangqi janggi shogi dobutsu gorogoro kyoto tori makruk sittuyin asean makpong capablanca seirawan grand shako shogun synochess orda shinobi empire chak chennis duck spartan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12100e">
    <!-- Appli installée (PWA) : sans ça, le navigateur peint en blanc les zones qu'il dessine lui-même
         (barres système, débordements, avant le chargement des feuilles de style) -->
    <meta name="color-scheme" content="dark">
    <!-- Appli installée sur iPhone : barre d'état transparente (le fond sombre passe dessous, pas de bande blanche) ;
         Apple n'autorise pas le vrai plein écran -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>html { background: #12100e; color-scheme: dark; }</style>
    <title>{{ title }}</title>
    <link rel="stylesheet" href={{ static("chessground.css") }}>
    <link rel="stylesheet" href={{ static("board.css") }} crossorigin="anonymous">
    {% for key in piece_sets %}
    <link id="piece-set-{{ key }}" rel="stylesheet"><!-- la feuille du jeu de pièces est posée par client/document.ts -->
    {% endfor %}
    <link rel="stylesheet" href={{ static("extensions.css") }}>
    <link rel="stylesheet" href={{ static("style.css") }}>
    <link rel="stylesheet" href={{ static("preview.css") }}>
    <!-- Polices hébergées sur le site, pas chez Google (page /confidentialite) -->
    <link rel="stylesheet" href={{ static("fonts/polices.css") }}>
    <link rel="stylesheet" href={{ static("site.css") }}>
    <link rel="stylesheet" href={{ static("matatak-ui.css") }}>
    <link rel="stylesheet" href={{ static("reconnecting.css") }}>
    <link rel="stylesheet" href={{ static("bughouse.css") }}>
    <link rel="stylesheet" href={{ static("piece/mono/mono.css") }}>
    <link rel="stylesheet" href={{ static(view_css) }}>
    {% if extra_css %}{% for css in ([extra_css] if extra_css is string else extra_css) %}<link rel="stylesheet" href={{ static(css) }}>{% endfor %}{% endif %}
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href={{ static("favicon/apple-icon-180x180.png") }}>
    <link rel="icon" href={{ static("favicon/favicon.ico") }} type="image/x-icon" />
</head>

<body id="pychess-variants" style="--zoom:80;" data-dev="{{ dev }}" data-view="{{ view }}"
    data-asset-url="{{ asseturl }}" data-lang="{{ lang }}" data-theme="{{ theme }}" data-home="{{ home }}" data-asset-version="{{ asset_version }}"
    data-username="{{ username }}" data-email="{{ email }}" data-anon="{{ anon }}" data-gameid="{{ gameid }}"
    data-tournamentid="{{ tournamentid }}" data-tournamentname="{{ tournamentname }}" data-inviter="{{ inviter }}" data-choixequipe="{{ choixequipe }}"
    data-ply="{{ ply }}" data-initialfen="{{ initialFen}}" data-ct="{{ ct }}" data-board="{{ board }}"
    data-date="{{ date }}" data-result="{{ result }}" data-status="{{ status }}" data-profile="{{ profile }}"
    data-title="{{ profile_title }}" data-variant="{{ variant }}" data-chess960="{{ chess960 }}"
    data-rated="{{ rated }}" data-corr="{{ corr }}" data-level="{{ level }}" data-wplayer="{{ wplayer }}"
    data-wtitle="{{ wtitle }}" data-wrating="{{ wrating }}" data-wrdiff="{{ wrdiff }}" data-wberserk="{{ wberserk }}"
    data-bplayer="{{ bplayer }}" data-btitle="{{ btitle }}" data-brating="{{ brating }}" data-brdiff="{{ brdiff }}"
    data-bberserk="{{ bberserk }}" data-fen="{{ fen }}" data-posnum="{{ posnum }}" data-base="{{ base }}"
    data-inc="{{ inc }}" data-byo="{{ byo }}" data-seekempty="{{ seekempty }}" data-puzzle="{{ puzzle }}"
    data-corrgames="{{ corr_games }}" data-tournamentdirector="{{ tournamentdirector }}" {% if oauth_username_selection
    %} data-oauth-id="{{ oauth_username_selection.oauth_id }}"
    data-oauth-provider="{{ oauth_username_selection.oauth_provider }}"
    data-oauth-username="{{ oauth_username_selection.oauth_username }}"
    data-oauth-email="{{ oauth_username_selection.oauth_email }}" {% endif %} data-wplayer-b="{{ wplayerB }}"
    data-wtitle-b="{{ wtitleB }}" data-wrating-b="{{ wratingB }}" data-bplayer-b="{{ bplayerB }}"
    data-btitle-b="{{ btitleB }}" data-brating-b="{{ bratingB }}">
    <img class="frame-layer" src={{ static("images/background/leaves-all.png") }} alt="">
    {% block header %}{% endblock %}
    {% block content %}{% endblock %}
    <a id="reconnecting" class="link text" data-icon="p"><info-date id="reconnecting-ts" timestamp=""></info-date></a>
    <script src="{{ static('./js/zoomManager.js') }}"></script>
    <script src="{{ static('./js/pwa-update.js') }}"></script>
    <script src="{{ static('./js/plein-ecran.js') }}"></script>
    <script src="{{ static('./js/installer.js') }}"></script>
</body>

</html>
{% block js %}{% endblock %}
